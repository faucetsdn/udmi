<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testbed Workspace</title>

  <!-- Fonts & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../shared/theme.css?v=1.5">
  <link rel="stylesheet" href="style.css?v=1.5">
</head>

<body>

  <div class="tool-layout">

    <!-- Top Action Bar -->
    <div class="testbed-action-bar">
      <div class="action-bar-left">
        <span class="material-symbols-outlined icon-blue">schema</span>
        <h2 class="title">Testbed Setup</h2>
      </div>

      <div class="action-bar-right">
        <button id="btn-default-setup" class="btn btn-outlined"
          title="Configure Local Setup topology (Pubber -> Local Broker -> Local UDMIS)">
          <span class="material-symbols-outlined">auto_fix_high</span>
          <span>Local Setup</span>
        </button>
        <button id="btn-cloud-setup" class="btn btn-outlined"
          title="Configure Zanzara Cloud Setup topology (Device -> Zanzara Ingress -> Message Fabric -> Cloud UDMIS -> etcd)">
          <span class="material-symbols-outlined">cloud_sync</span>
          <span>Zanzara Cloud Setup</span>
        </button>
        <button id="btn-stop-pipeline" class="btn btn-danger-outlined"
          title="Stop all locally running background pipeline components">
          <span class="material-symbols-outlined">stop</span>
        </button>
      </div>
    </div>

    <!-- Main Workspace Layout: Palette | Canvas | Inspector -->
    <main class="testbed-workspace">

      <!-- 1. Node Palette Sidebar -->
      <aside class="palette-sidebar" style="overflow-y: hidden; display: flex; flex-direction: column; width: 290px;">
        <div class="sidebar-header border-bottom" style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span class="material-symbols-outlined" style="color: #0b57d0; font-size: 16px;">devices</span>
            <h3 style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #5f6368;">Site Devices
            </h3>
          </div>
          <span id="site-devices-count-badge" class="badge"
            style="background: #e8f0fe; color: #1a73e8; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;">0</span>
          </div>
<!-- Search & Filter Bar -->
<div style="padding: 8px 8px 4px 8px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
  <div class="device-search-wrapper" style="position: relative; display: flex; align-items: center;">
    <span class="material-symbols-outlined"
      style="position: absolute; left: 8px; font-size: 15px; color: #80868b; pointer-events: none;">search</span>
    <input type="text" id="input-device-search" placeholder="Filter devices..." class="form-input"
      style="width: 100%; padding: 4px 8px 4px 28px; font-size: 11px; height: 28px; border-radius: 6px; box-sizing: border-box;" />
    <button id="btn-device-search-clear"
      style="display: none; position: absolute; right: 6px; background: none; border: none; cursor: pointer; color: #80868b; font-size: 14px; padding: 0; line-height: 1;">&times;</button>
          </div>

          <!-- Bulk Actions Toolbar -->
          <div class="device-bulk-toolbar"
            style="display: flex; align-items: center; justify-content: space-between; gap: 4px; padding-bottom: 2px;">
            <div style="display: flex; gap: 4px;">
              <button id="btn-devices-select-all" class="btn btn-outlined"
                style="padding: 2px 8px; font-size: 10px; height: 22px; border-radius: 4px;"
                title="Select all devices onto canvas">All</button>
              <button id="btn-devices-clear-all" class="btn btn-outlined"
                style="padding: 2px 8px; font-size: 10px; height: 22px; border-radius: 4px;"
                title="Remove all devices from canvas">None</button>
            </div>
            <span id="site-devices-selected-summary" style="font-size: 10px; color: #5f6368; font-weight: 500;">0 selected</span>
          </div>
        </div>

        <!-- Dynamic Device List Container (Pills) -->
        <div id="site-devices-list" class="site-devices-list site-devices-pills-container"
          style="flex: 1; overflow-y: auto; padding: 6px 8px 8px 8px;">
          <div style="font-size: 11px; color: #70757a; text-align: center; padding: 20px 8px; width: 100%;">
            <span class="spinner-sm" style="margin-bottom: 6px;"></span>
            <div>Loading devices from site model...</div>
          </div>
        </div>
      </aside>

      <!-- 2. Interactive Topology Graph Canvas -->
      <section id="canvas-container" class="canvas-container">
        <div id="graph-canvas" class="graph-canvas">
          <svg id="canvas-svg" width="100%" height="100%"></svg>
          <div id="nodes-layer" class="nodes-layer"></div>
        </div>
      </section>

      <!-- 3. Node Inspector & Config Panel -->
      <aside id="inspector-panel" class="inspector-panel">
        <div class="inspector-header border-bottom">
          <div class="inspector-title-row">
            <span id="inspector-icon" class="material-symbols-outlined icon">tune</span>
            <h3 id="inspector-title">Node Inspector</h3>
          </div>
          <button id="btn-close-inspector" class="btn-icon-xs"><span
              class="material-symbols-outlined">close</span></button>
        </div>

        <div id="inspector-body" class="inspector-body">
          <div class="inspector-empty">
            <span class="material-symbols-outlined">touch_app</span>
            <p>Select a node on the canvas to configure parameters and check its health status.</p>
          </div>
        </div>
      </aside>

    </main>

  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="main.js"></script>
</body>

</html>
