<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDMI Workbench</title>
  <link rel="icon" type="image/png" href="/assets/workbench_logo.png">

  <!-- Fonts & Material Icons (Google Testrun Aligned) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="shared/theme.css?v=1.4">
  <link rel="stylesheet" href="style.css?v=1.4">
</head>

<body>

  <!-- Application Loading Overlay -->
  <div id="app-loader" class="app-loader-overlay">
    <div class="loader-content">
      <img src="/assets/workbench_logo.png" alt="UDMI Logo" class="loader-logo" />
      <div class="loader-track">
        <div class="loader"></div>
      </div>
      <div class="loader-text">Loading UDMI Workbench...</div>
    </div>
  </div>

  <!-- Main App Shell -->
  <div class="app-shell">

    <!-- Top App Toolbar (Brand & Centered Site Model Path Input) -->
    <header class="app-toolbar">
      <div class="toolbar-brand">
        <img src="/assets/workbench_logo.png" alt="UDMI Logo" class="brand-logo-img" />
        <div class="brand-text-group">
          <h1 class="brand-title">Workbench</h1>
        </div>
      </div>

      <!-- Centered Site Model Path Input -->
      <div class="toolbar-center">
        <div class="input-with-button">
          <input type="text" id="site-input" class="form-input site-input-state-unselected" style="width: 360px;"
            placeholder="Site Model Path..." aria-label="Site Model Path" />
          <button id="btn-browse-site" class="btn btn-outlined btn-icon-sm" aria-label="Browse site model folder">
            <span class="material-symbols-outlined">folder_open</span>
          </button>
        </div>
      </div>

      <div class="toolbar-actions">
        <!-- Right toolbar actions space -->
      </div>
    </header>

    <!-- Sub-Header Horizontal Material Design Tab Bar -->
    <nav id="app-nav-tabs" class="app-tab-bar" aria-label="Main Navigation">
      <button class="m3-tab active" data-tab="testbed" data-feature="testbed" aria-selected="true" role="tab">
        <span class="material-symbols-outlined icon">hub</span>
        <span>Testbed</span>
      </button>
      <button class="m3-tab" data-tab="sequencer" data-feature="sequencer" aria-selected="false" role="tab">
        <span class="material-symbols-outlined icon">analytics</span>
        <span>Sequencer</span>
      </button>
      <!-- Animated Active Tab Underline Indicator -->
      <div class="m3-tab-indicator"></div>
    </nav>

    <!-- Onboarding Callout Banner (Prompt when no site model is loaded) -->
    <div id="site-onboarding-banner" class="onboarding-banner" style="display: none;">
      <span class="material-symbols-outlined icon">info</span>
      <span class="text">Welcome to UDMI Workbench! Please select or enter a valid Site Model Path above to begin.</span>
    </div>

    <!-- App Body -->
    <main class="app-main">

      <!-- Workspace Panel Content (Micro-Frontend Iframe Containers) -->
      <section class="app-content" style="width: 100%; height: 100%; overflow: hidden; padding: 0; position: relative;">
        <!-- Testbed Iframe -->
        <iframe id="iframe-testbed" class="app-iframe active" src="testbed/index.html" data-feature="testbed"></iframe>
        <!-- Sequencer Iframe -->
        <iframe id="iframe-sequencer" class="app-iframe" src="sequencer/index.html" data-feature="sequencer"></iframe>
      </section>
    </main>

    <!-- Mantis AI Sidebar Drawer (Global AI Assistant Side Panel with Edge Pull Tab) -->
    <aside id="mantis-drawer" class="mantis-drawer" aria-label="Mantis AI Assistant">
      <!-- Right Edge Pull Tab Handle -->
      <button id="mantis-pull-tab" class="mantis-pull-tab" title="Toggle Mantis AI Assistant" aria-label="Toggle Mantis AI Assistant">
        <span class="material-symbols-outlined icon">auto_awesome</span>
        <span class="label">Mantis AI</span>
      </button>

      <div class="mantis-drawer-header">
        <div class="header-title">
          <span class="material-symbols-outlined icon">auto_awesome</span>
          <span>Mantis AI Assistant</span>
        </div>
        <button id="btn-close-mantis-drawer" class="btn-close" aria-label="Close Mantis AI Drawer">&times;</button>
      </div>
      <div class="mantis-drawer-body">
        <iframe id="iframe-mantis" class="mantis-drawer-iframe" src="mantis/index.html" data-feature="mantis"></iframe>
      </div>
    </aside>

  </div>

  <!-- Inline Folder Browser Modal (Managed by parent and shared globally) -->
  <div id="folder-browser-modal" class="modal-overlay">
    <div class="modal-card glass-panel">
      <div class="modal-header">
        <div>
          <h3 style="margin: 0;">Select Site Model Directory</h3>
          <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-secondary);">Choose your UDMI Site Model path to initialize Workbench services.</p>
        </div>
        <button id="btn-close-browser" class="btn-close" aria-label="Close folder browser">&times;</button>
      </div>
      <div class="modal-body">
        <div class="browser-path-bar">
          <button id="btn-browser-up" class="btn btn-outlined btn-icon-sm" aria-label="Go to parent directory">
            <span class="material-symbols-outlined">arrow_upward</span>
          </button>
          <input type="text" id="browser-current-path" class="form-input flex-1" aria-label="Current path" />
        </div>
        <div class="browser-list" aria-label="Directory list">
          <!-- Populated dynamically with subdirectories -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-browser-cancel" class="btn btn-outlined">Cancel</button>
        <button id="btn-browser-select" class="btn btn-primary">Select Directory</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Shell Module -->
  <script type="module" src="main.js"></script>
</body>

</html>
